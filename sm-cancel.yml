                            - /placeholder: ""
                            - text: "savemedia saves the video you are watching as an MP4, WebM or MKV file in your Downloads folder, when the browser already receives it unprotected. DRM, encrypted streams, live streams and anything behind a paywall or sign-in are refused, and it never leaves a half-downloaded file behind. Press Alt+S to save the best supported video on the current page, or open the popup to pick from everything detected. The popup shows for each item whether savemedia can save it, and why not when it cannot. Supported: direct MP4, WebM, and MKV files verified by headers or bytes; plain HLS VOD with MPEG-TS segments remuxed locally to MP4; clear HLS fMP4/CMAF streams assembled locally after MP4 box validation. Not supported: encrypted HLS and DASH. When something cannot be saved, the popup says so instead of writing a broken file. Everything runs locally in the browser. No telemetry, ads, accounts, or developer-operated server."
