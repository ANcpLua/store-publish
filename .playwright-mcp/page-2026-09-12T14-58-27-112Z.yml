                          - /placeholder: ""
                          - text: "savemedia saves browser-visible video when it can verify and finish one playable file. Press Alt+S to save the best supported video on the current page, or open the popup to pick from everything detected. The popup shows for each item whether savemedia can save it, and why not when it cannot. Supported: direct MP4, WebM, and MKV files verified by headers or bytes; plain HLS VOD with MPEG-TS segments remuxed locally to MP4; clear HLS fMP4/CMAF streams assembled locally after MP4 box validation. Refused: DRM, encrypted HLS, DASH, live streams, and anything that is only reachable behind a paywall or a sign-in. savemedia saves what the browser has already received in the clear, and refuses rather than write a broken file. Everything runs locally in the browser. No telemetry, ads, accounts, or developer-operated server."
